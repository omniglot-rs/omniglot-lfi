[workspace]
resolver = "2"
members = [
    "omniglot-lfi",
    "examples/add",
]

[workspace.metadata.crane]
name = "omniglot-lfi-workspace"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies.omniglot]
git = "https://github.com/omniglot-rs/omniglot"
rev = "d5b58f7913b2afd55c4db9c45b97cb947900bb4e"
# path = "../omniglot/omniglot"
features = [ "std" ]

[workspace.dependencies.bindgen]
git = "https://github.com/omniglot-rs/rust-bindgen"
rev = "fffcf97244fc77c2cfa8d2290d740385f18021f1"
# path = "../rust-bindgen/bindgen"
