[workspace]
resolver = "2"
members = [
    "examples/add",
    "examples/brotli",
    "examples/fetch-prebuilt",
    "examples/libpng",
    "examples/llhttp",
    "examples/sodium",
    "omniglot-lfi",
    "tests",
    "microbenchmarks",
]

[workspace.metadata.crane]
name = "omniglot-lfi-workspace"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies.omniglot]
git = "https://github.com/omniglot-rs/omniglot"
rev = "70989be54dfab218f9eb5ab3f67dd145f45b19c7"
# path = "../omniglot/omniglot"
features = [ "std" ]

[workspace.dependencies.bindgen]
git = "https://github.com/omniglot-rs/rust-bindgen"
rev = "1857e928405797948bfb393c0503c2edb79c33b1"
# path = "../rust-bindgen/bindgen"
