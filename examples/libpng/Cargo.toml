[package]
name = "omniglot-lfi-example-libpng"
version = "0.1.0"
edition = "2021"

[features]
disable_upgrade_checks = ["omniglot/unsound", "omniglot/disable_upgrade_checks"]
disable_validation_checks = ["omniglot/unsound", "omniglot/disable_validation_checks"]
explicit_allow_revoke = []
auto_allow_revoke = []

[build-dependencies]
bindgen.workspace = true
fetch-prebuilt = { path = "../fetch-prebuilt" }

[dev-dependencies]
criterion = "0.8.1"

[dependencies]
omniglot.workspace = true
omniglot-lfi = { path = "../../omniglot-lfi" }
fetch-prebuilt = { path = "../fetch-prebuilt" }
env_logger = "0.11.8"
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }
hex-literal = "1.1.0"

[[bench]]
name = "libpng_decode_comparison"
harness = false
