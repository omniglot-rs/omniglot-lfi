[package]
name = "omniglot-lfi-example-brotli"
version = "0.1.0"
edition = "2021"

[features]
disable_upgrade_checks = ["omniglot/unsound", "omniglot/disable_upgrade_checks"]
disable_validation_checks = ["omniglot/unsound", "omniglot/disable_validation_checks"]

[build-dependencies]
bindgen.workspace = true

# To fetch and unpack prebuilt examples:
json = "0.12"
hex = "0.4.3"
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
flate2 = "1.1"
tar = "0.4"

[dev-dependencies]
criterion = "0.8.1"

[dependencies]
omniglot.workspace = true
omniglot-lfi = { path = "../../omniglot-lfi" }
env_logger = "0.11.8"
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }

[[bench]]
name = "brotli_compression_comparison"
harness = false
